version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # Storage Layer: MongoDB State Store
  # ---------------------------------------------------------------------------
  mongodb:
    image: mongo:7.0
    container_name: stream-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: stream_community_db
    volumes:
      - mongo_data:/data/db

  # ---------------------------------------------------------------------------
  # Message Bus: Apache Kafka & Zookeeper (Streaming Event Ingestion)
  # ---------------------------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: stream-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: stream-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # ---------------------------------------------------------------------------
  # Compute Layer: Apache Spark Master & Worker (GraphX Distributed Cluster)
  # ---------------------------------------------------------------------------
  spark-master:
    image: bitnami/spark:3.5.0
    container_name: stream-spark-master
    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
    ports:
      - "8080:8080"
      - "7077:7077"

  spark-worker:
    image: bitnami/spark:3.5.0
    container_name: stream-spark-worker
    depends_on:
      - spark-master
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2

  # ---------------------------------------------------------------------------
  # Presentation Layer: Streamlit Real-Time Dashboard
  # ---------------------------------------------------------------------------
  dashboard:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: stream-community-dashboard
    depends_on:
      - mongodb
    ports:
      - "8501:8501"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/
      - MONGO_DB=stream_community_db
    restart: always

volumes:
  mongo_data:
